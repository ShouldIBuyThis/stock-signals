name: 종목별 백테스트 승률 생성

# 수동 실행 전용. 종목별 개별 승률의 표본을 늘리기 위한 1회성 작업이다.
#
# frozen 원장(signals.json)은 30거래일뿐이라 종목당 강한매수가 1~5건이고
# 화면에 대부분 '표본 부족'으로 나온다. main.py는 매 실행마다 야후에서 1년치를
# 받아 최근 30일만 쓰고 버리는데, 그 버리는 부분을 한 번 살려 표본을 6배로 만든다.
#
# ⚠ 원장은 건드리지 않는다. signals.json·history/ 는 이 워크플로우가 쓰지 않는다.
#    산출물은 backtest/ticker-record.json 하나뿐이고, 그 안에 '백테스트'라는
#    사실과 생존 편향 경고가 함께 들어간다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: '거래일 수 (야후 1년 ≈ 252봉, 워밍업 66봉 필요 → 186 이하)'
        required: false
        default: '180'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: pip install -q yfinance pandas numpy exchange_calendars

      - name: 장기 원본 수집 (야후 1년)
        run: python tools/backfill_backtest.py --days "${{ inputs.days || '180' }}" --out backtest/raw.json

      - name: 종목별 승률 표 생성
        run: node tools/ticker-record-build.js backtest/raw.json backtest/ticker-record.json

      - name: 실험 — 주봉·월봉 상위 시간대 맥락 (로그 출력 전용)
        # 사용자 요청(2026-08-22): "주봉 월봉까지 보정값 포함해서 매수자리 보는
        # 산식으로 하면 승률 어떻게 되나". 산식은 안 건드리고 신호를 갈라서 재기만 한다.
        continue-on-error: true
        run: node tools/mtf-lab.js backtest/raw.json

      - name: 실험 — 갭 가점 · 미너비니 · 갭 메움 예측 (로그 출력 전용)
        # raw.json은 커밋하지 않으므로 여기서만 잴 수 있다. 결과는 로그로만 남고
        # 사이트·원장은 건드리지 않는다. 실패해도 백테스트 산출물은 그대로 커밋한다.
        continue-on-error: true
        run: node tools/gap-score-lab.js backtest/raw.json

      - name: 실험 — 시장 국면 판정 후보 비교 (로그 출력 전용)
        # 사용자 지시(2026-08-25): "국면판정부터 고쳐줘 측정하고 보고하고".
        # 8/13~8/21 국면이 neutral로 남아 방어섹터 게이트가 한 번도 안 걸린 건이 발단.
        # 국면 라벨만 갈아끼우고 화면 산식(strategyValidation)을 그대로 다시 돌린다.
        continue-on-error: true
        run: node tools/regime-lab.js backtest/raw.json

      - name: 실험 — 반등 매수관심(등급4) 문턱 후보 (로그 출력 전용)
        # 사용자 지시(2026-08-25): "반등 매수관심 문턱을 올려주고".
        # 189일 실측에서 47/46/39/38%로 기준선 -14%p. 현행 문턱은 30거래일
        # 표본 56/28/15건에서 정해진 값이다. 등급4 조건 한 줄만 갈아끼워 비교한다.
        continue-on-error: true
        run: node tools/rev4-lab.js backtest/raw.json

      - name: 실험 — 차트 패턴 18종 진입 목록 생성 (야후 OHLC · 로그 출력 전용)
        # 패턴 판정은 High/Low가 필요한데 원장에는 종가만 있다. 여기서 확정 피벗
        # (리페인트 금지)으로 진입일 목록을 만들어 다음 단계에 넘긴다.
        continue-on-error: true
        run: python tools/pattern-lab.py --years 3 --emit backtest/pattern-entries.json

      - name: 실험 — 역헤숄·쌍바닥 뱃지/가산점 시뮬레이션 (로그 출력 전용)
        # 사용자 지시(2026-08-25): "역헤숄 쌍바닥은 뱃지도 달아주고 가산점 한다면 승률은?"
        continue-on-error: true
        run: node tools/pattern-score-lab.js backtest/raw.json backtest/pattern-entries.json

      - name: 실험 — 변동성 꺾임·연속하락 축을 개별주에 적용 (로그 출력 전용)
        # 사용자 지시(2026-08-25): "나스닥에 쓰던 변동성 꺾임 등 지표를 개별주에도
        # 일부 적용해서 승률 시뮬레이션, 반등매수관심 등에."
        # VXN 과거값은 원장에 없고 raw.json의 macro.vxn 에만 있으므로 여기서만 잰다.
        continue-on-error: true
        run: node tools/vol-lab.js backtest/raw.json

      - name: 실험 — 반등 매수관심 문턱을 변동성으로 조인다 (로그 출력 전용)
        # 사용자 지시(2026-08-25): "반등 매수관심 변동성 활용해서 승률 문턱 높여봐".
        # 앞선 두 실험이 방향을 정해 줬다 — 이 계층은 시장이 밀린 날일수록 더 나쁘다.
        # 그래서 점수를 더 요구하는 대신 '그런 날엔 등급4를 안 준다'로 건다.
        continue-on-error: true
        run: node tools/rev4-vol-lab.js backtest/raw.json

      - name: 실험 — 강한매수 재배정 — 지지반등 가점 · VXN 가점 · 국면 감점 보정 (로그 출력 전용)
        # 사용자 지시(2026-08-25): "단기지지·중기지지를 크게 안 깨고 반등한 주식에 가산점,
        # 시장 4단계·공포지수 보정해서 강한매수 산식 재배정하면 승률 어떻게 되나".
        continue-on-error: true
        run: node tools/rebalance-lab.js backtest/raw.json

      - name: 실험 — v13 후보 (강한다중 전환조건 · 반등 매수관심 재정의 · 약세 감점 VXN · 신규 지표)
        # 사용자 지시(2026-09-03). 네 축을 같은 판에서 잰다. 로그 출력 전용.
        continue-on-error: true
        run: node tools/v13-lab.js backtest/raw.json

      - name: 실험 — 테마 랭킹 예측 (백테스트 189일 + 30일 원장)
        # 사용자 지시(2026-09-03): "테마 랭킹 3위까지 + 예측, 30일 원장 흐름 검증 포함".
        continue-on-error: true
        run: |
          node tools/theme-lab.js backtest/raw.json
          echo "════════ 30일 원장(signals.json) ════════"
          node tools/theme-lab.js signals.json

      - name: 원본은 커밋하지 않는다 (약 5MB)
        run: rm -f backtest/raw.json backtest/pattern-entries.json

      - name: 원장이 바뀌지 않았는지 확인
        # 이 워크플로우는 backtest/ 밖을 절대 건드리면 안 된다.
        run: |
          if [ -n "$(git status --porcelain -- signals.json history/)" ]; then
            echo "::error::원장(signals.json·history/)이 변경됐다 — 중단한다"
            git status --porcelain -- signals.json history/
            exit 1
          fi

      - name: 커밋
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add backtest/ticker-record.json backtest/ticker-record-samples.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "종목별 백테스트 승률 갱신 (${{ inputs.days || '180' }}거래일)"
            # 이 잡은 몇 분 걸린다. 그 사이 사람이 main에 커밋하면 push가 막히고,
            # 다 만들어 놓은 결과를 버리게 된다(2026-08-18 run #… 실제 사례).
            # 산출물은 backtest/ 두 파일뿐이라 리베이스로 안전하게 얹을 수 있다.
            # 현재 체크아웃된 브랜치로 리베이스해야 한다. main으로 고정해 두면
            # 브랜치에서 돌릴 때 영원히 못 따라잡는다(2026-08-25 run #27 실제 사례:
            # 리베이스는 성공하는데 push는 계속 거부 → 결과를 통째로 버렸다).
            BR="${GITHUB_REF_NAME}"
            for i in 1 2 3; do
              if git push origin "HEAD:${BR}"; then exit 0; fi
              echo "push 충돌 — 리베이스 후 재시도 ($i/3)"
              git pull --rebase origin "${BR}"
              sleep $((i*5))
            done
            echo "::error::리베이스 재시도 3회 실패"
            exit 1
          fi
