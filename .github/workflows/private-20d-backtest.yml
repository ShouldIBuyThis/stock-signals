name: 🔬 과거 +20 백테스트

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 불러오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 라이브러리 설치
        run: pip install --upgrade yfinance pandas numpy exchange_calendars

      - name: 과거 데이터 수집 + 현재 main.py 원시지표 재현
        run: python private_20d_backtest_prepare.py

      - name: 현재 index.html 산식으로 +20 백테스트
        run: node private_20d_backtest.js

      - name: 결과를 Actions 요약에 표시
        if: always()
        shell: bash
        run: |
          echo "## 🔬 과거 +20거래일 백테스트" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f private_20d_backtest_report.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat private_20d_backtest_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "리포트가 생성되지 않았습니다. 실행 로그를 확인하세요." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 개인 백테스트 결과 보관
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: private-20d-backtest-result
          path: |
            private_20d_backtest_report.txt
            private_20d_backtest_samples.csv
          retention-days: 7
