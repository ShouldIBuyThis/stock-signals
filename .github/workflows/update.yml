name: 관심종목 자동 갱신

on:
  schedule:
    # ── 한국시간(KST) = UTC+9 ──────────────────────────────────
    # 미국장: 뉴욕 마감(16:00 ET) 이후에 돌아야 당일 종가가 잡힌다.
    #   서머타임(3~11월, EDT=UTC-4) : 20:40 UTC = 16:40 ET  → 마감 40분 후 ✅
    #   겨울(11~3월,  EST=UTC-5)    : 20:40 UTC = 15:40 ET  → 마감 20분 전 ❌
    #   그래서 겨울 대비로 21:40 UTC 슬롯을 하나 더 둔다(16:40 ET).
    #   요일 0-5(일~금) : 금요일 20:40 UTC = 토요일 05:40 KST
    #                     → 금요일 미국 종가가 토요일 아침에 들어온다.
    - cron: '40 20 * * 0-5'   # 05:40 KST (월~토) — 서머타임용
    - cron: '40 21 * * 0-5'   # 06:40 KST (월~토) — 겨울(EST) 보정용
    # 한국장: 마감 15:30 KST → 10분 후
    - cron: '40 6 * * 1-5'    # 15:40 KST (월~금)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write   # signals.json 커밋
  pages: write      # Pages 배포
  id-token: write   # Pages 배포 인증

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install yfinance pandas numpy

      - name: 지표 계산
        run: python main.py

      - name: signals.json 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signals.json history/
          git commit -m "auto: signals 갱신" || echo "변경 없음"
          # 같은 시간대에 두 스케줄이 겹칠 수 있으므로 원격 변경분을 먼저 당겨온다
          git pull --rebase --autostash
          git push

      # ── 여기서부터 사이트 재배포 (데이터 갱신과 같은 워크플로우에서 처리) ──
      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'     # 저장소 전체(index.html + signals.json)

      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
