name: 관심종목 자동 갱신

on:
  schedule:
    # UTC 기준 (한국시간 = UTC+9)
    #  00:00 UTC = 09:00 KST  /  07:00 UTC = 16:00 KST
    - cron: '0 0,7 * * *'
  workflow_dispatch:    # 저장소 Actions 탭에서 수동 실행 버튼

permissions:
  contents: write      # signals.json 커밋 권한

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치
        run: pip install yfinance pandas numpy
      - name: 지표 계산
        run: python main.py
      - name: signals.json 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signals.json
          git commit -m "auto: signals 갱신" || echo "변경 없음"
          git push
