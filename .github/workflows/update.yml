name: 관심종목 자동 갱신

on:
  schedule:
    # 한국시간(KST) = UTC+9.  주중(월~금)만.
    - cron: '0 0 * * 1-5'   # 09:00 KST (= 00:00 UTC)
    - cron: '0 7 * * 1-5'   # 16:00 KST (= 07:00 UTC)
  workflow_dispatch:        # Actions 탭에서 수동 실행(장중에 지금 시세 보고 싶을 때)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치
        run: pip install yfinance pandas numpy
      - name: 지표 계산
        run: python main.py
      - name: signals.json 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signals.json
          git commit -m "auto: signals 갱신" || echo "변경 없음"
          git push
