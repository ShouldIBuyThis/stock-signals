name: 관심종목 자동 갱신

on:
  schedule:
    # 미국장 1차: 뉴욕 현지 16:40 — 장 마감 40분 후
    - cron: '40 16 * * 1-5'
      timezone: 'America/New_York'
    # 미국장 백업: 뉴욕 현지 17:20 — 1차 schedule 누락/지연 대비
    - cron: '20 17 * * 1-5'
      timezone: 'America/New_York'

    # 한국장 1차: 15:45 KST
    - cron: '45 15 * * 1-5'
      timezone: 'Asia/Seoul'
    # 한국장 백업: 16:20 KST — 1차 schedule/업로드 실패 대비
    - cron: '20 16 * * 1-5'
      timezone: 'Asia/Seoul'
    # 한국장 백업2·3 — GitHub이 schedule을 통째로 누락시키는 날이 실제로 있었다
    # (2026-08-11·12·13 사흘 연속 KR 실행 0건, 같은 날 US는 정상 실행).
    # 지연도 80~225분으로 커서, '정각·15·30·45분' 혼잡 시간을 피한 어중간한
    # 분(:53, :37)에 두 번 더 시도한다. 같은 거래일을 다시 받아도 frozen 원장은
    # 그대로이고 변경이 없으면 커밋도 없다 — 여러 번 시도해도 안전하다.
    - cron: '53 16 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '37 18 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      scope:
        description: '수동 갱신 범위'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - kr
          - all
      force_resnap:
        description: '현재 scope의 당일 스냅샷/hist를 강제로 다시 확정'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: 최신 원장으로 시작
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C ci-update origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install "yfinance==1.5.2" pandas numpy exchange_calendars

      - name: 갱신 범위 결정
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$MANUAL_SCOPE" >> "$GITHUB_OUTPUT"
            echo "수동 실행 → scope=$MANUAL_SCOPE"
            exit 0
          fi

          # 중요: 실제 runner 시작 시각으로 시장을 판단하지 않는다.
          # GitHub schedule은 지연될 수 있으므로, 어떤 schedule이 트리거했는지를 기준으로 판정한다.
          case "$SCHEDULE_EXPR" in
            "40 16 * * 1-5"|"20 17 * * 1-5")
              echo "value=us" >> "$GITHUB_OUTPUT"
              echo "자동 실행 → US ($SCHEDULE_EXPR)"
              ;;
            "45 15 * * 1-5"|"20 16 * * 1-5"|"53 16 * * 1-5"|"37 18 * * 1-5")
              echo "value=kr" >> "$GITHUB_OUTPUT"
              echo "자동 실행 → KR ($SCHEDULE_EXPR)"
              ;;
            *)
              echo "::error::알 수 없는 schedule: '$SCHEDULE_EXPR'"
              exit 1
              ;;
          esac

      - name: 재촬영 요청 확인
        id: resnap
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_FORCE_RESNAP: ${{ inputs.force_resnap }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FORCE_RESNAP" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "⚠ FORCE_RESNAP=true — scope=${{ steps.scope.outputs.value }}"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 갱신 전 frozen 원장 보관
        shell: bash
        run: cp signals.json "$RUNNER_TEMP/signals.before.json"

      - name: 지표 계산 1차
        id: calc
        continue-on-error: true
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: python main.py

      - name: 지표 계산 실패 시 10분 뒤 1회 재시도
        if: steps.calc.outcome == 'failure'
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: |
          echo "1차 갱신 실패 — 10분 뒤 같은 범위로 1회 재시도합니다."
          sleep 600
          python main.py

      - name: 산출물 기본 검증
        shell: bash
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: |
          set -euo pipefail
          args=(signals.json --previous "$RUNNER_TEMP/signals.before.json" --scope "$RUN_SCOPE")
          if [ "$FORCE_RESNAP" = "true" ]; then args+=(--force-resnap); fi
          python validate_signals.py "${args[@]}"

          # 자동/일반 실행은 기존 snapshot 파일 수정을 절대 허용하지 않는다.
          if [ "$FORCE_RESNAP" != "true" ] && [ -n "$(git diff --name-only --diff-filter=M -- history/)" ]; then
            echo "::error::FORCE_RESNAP 없이 기존 history snapshot이 수정됐습니다."
            git diff --name-status -- history/
            exit 1
          fi

      - name: 실패 학습 리포트 생성
        # 중립 판정 직후 급등한 종목의 관문 부검 (tools/miss-report.js).
        # 리포트 실패가 데이터 갱신을 막으면 안 되므로 continue-on-error.
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          node tools/miss-report.js > reports/실패학습.md

      - name: signals.json / history 커밋
        shell: bash
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          commit_generated() {
            git add signals.json history/ reports/
            git commit -m "auto: signals 갱신 ($RUN_SCOPE)" || echo "변경 없음"
          }

          validate_retry() {
            args=(signals.json --previous "$RUNNER_TEMP/signals.before.retry.json" --scope "$RUN_SCOPE")
            if [ "$FORCE_RESNAP" = "true" ]; then args+=(--force-resnap); fi
            python validate_signals.py "${args[@]}"
            if [ "$FORCE_RESNAP" != "true" ] && [ -n "$(git diff --name-only --diff-filter=M -- history/)" ]; then
              echo "::error::재시도 중 기존 history snapshot 수정 감지"
              exit 1
            fi
          }

          commit_generated
          if git push origin HEAD:main; then
            exit 0
          fi

          # 원격 signals.json이 새로 갱신된 경우 자동 merge로 원장을 선택하지 않는다.
          # 최신 원격 원장에서 같은 scope를 다시 계산해 히스토리 유실을 막는다.
          for attempt in 2 3; do
            echo "푸시 충돌 — 최신 원장에서 ${attempt}차 재계산"
            git fetch origin main
            git switch -C ci-update origin/main
            cp signals.json "$RUNNER_TEMP/signals.before.retry.json"
            RUN_SCOPE="$RUN_SCOPE" FORCE_RESNAP="$FORCE_RESNAP" python main.py
            validate_retry
            node tools/miss-report.js > reports/실패학습.md || echo "리포트 생성 실패 — 갱신은 계속"
            commit_generated
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "::error::최신 원장 재계산 후에도 푸시가 3회 충돌했습니다."
          exit 1

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
