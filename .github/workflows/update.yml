name: 관심종목 자동 갱신

on:
  schedule:
    # 미국장: 뉴욕 현지 16:10 — 장 마감 10분 후, DST 자동 반영
    - cron: '10 16 * * 1-5'
      timezone: 'America/New_York'
    # 한국장: 15:45 KST — 무료 시세의 종가 반영 지연을 감안해 여유 있게 실행
    - cron: '45 15 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      scope:
        description: '수동 갱신 범위'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - kr
          - all

permissions:
  contents: write   # signals.json 커밋
  pages: write      # Pages 배포
  id-token: write   # Pages 배포 인증

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install --upgrade yfinance pandas numpy exchange_calendars

      - name: 갱신 범위 결정
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 15 * * 1-5" ]; then
            echo "value=kr" >> "$GITHUB_OUTPUT"
          else
            echo "value=us" >> "$GITHUB_OUTPUT"
          fi

      - name: 지표 계산 1차
        id: calc
        continue-on-error: true
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
        run: python main.py

      - name: 실패 시 10분 뒤 1회 재시도
        if: steps.calc.outcome == 'failure'
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
        run: |
          echo "1차 갱신 실패 — 10분 뒤 같은 범위만 다시 시도합니다."
          sleep 600
          python main.py

      - name: signals.json 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signals.json history/
          git commit -m "auto: signals 갱신" || echo "변경 없음"
          git pull --rebase --autostash
          git push

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
 