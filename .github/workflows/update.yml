name: 관심종목 자동 갱신

on:
  schedule:
    # 미국장: 뉴욕 현지 16:10 — 장 마감 10분 후, DST 자동 반영
    - cron: '10 16 * * 1-5'
      timezone: 'America/New_York'
    # 한국장: 15:40 KST — 장 마감 10분 후
    - cron: '40 15 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write   # signals.json 커밋
  pages: write      # Pages 배포
  id-token: write   # Pages 배포 인증

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install --upgrade yfinance pandas numpy exchange_calendars

      - name: 지표 계산
        # 한국장 슬롯(15:40 KST)에서는 한국 가격만 새로 받고,
        # 미국 가격은 직전 signals.json 값을 그대로 유지한다.
        # 단, main.py가 미국 실적 캘린더는 한 번 더 조회해 장 시작 전 변경을 반영한다.
        env:
          RUN_SCOPE: ${{ github.event.schedule == '40 15 * * 1-5' && 'kr' || 'all' }}
        run: python main.py

      - name: signals.json 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signals.json history/
          git commit -m "auto: signals 갱신" || echo "변경 없음"
          # 같은 시간대에 두 스케줄이 겹칠 수 있으므로 원격 변경분을 먼저 당겨온다
          git pull --rebase --autostash
          git push

      # ── 여기서부터 사이트 재배포 (데이터 갱신과 같은 워크플로우에서 처리) ──
      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'     # 저장소 전체(index.html + signals.json)

      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
