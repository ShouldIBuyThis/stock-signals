name: 관심종목 자동 갱신

on:
  schedule:
    # ── 한국시간(KST) = UTC+9 ──────────────────────────────────
    # 미국장: 화면 안내 기준은 06:00, 실제 자동 패치는 마감 데이터 안정화를 위해 06:20 KST에 1회 실행.
    # 21:20 UTC는 서머/겨울 모두 미국 정규장 마감 이후다.
    - cron: '20 21 * * 0-5'   # 06:20 KST (월~토) — 미국장 종가 패치
    # 한국장: 화면 안내 기준 16:20, KRX 마감 후 yfinance 확정값 반영을 기다린 뒤 1회 실행.
    - cron: '20 7 * * 1-5'    # 16:20 KST (월~금) — 한국장 종가 패치
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write   # signals.json 커밋
  pages: write      # Pages 배포
  id-token: write   # Pages 배포 인증

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install yfinance pandas numpy

      - name: 지표 계산
        # 한국장 슬롯(16:20 KST)에서는 한국 종목만 새로 받고,
        # 미국 종목은 직전 signals.json 값을 그대로 유지한다.
        # (그 시각 뉴욕은 02:40이라 새 종가가 없고, 다시 부르면 장전에 점수가 흔들린다)
        env:
          RUN_SCOPE: ${{ github.event.schedule == '20 7 * * 1-5' && 'kr' || 'all' }}
        run: python main.py

      - name: signals.json 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signals.json history/
          git commit -m "auto: signals 갱신" || echo "변경 없음"
          # 같은 시간대에 두 스케줄이 겹칠 수 있으므로 원격 변경분을 먼저 당겨온다
          git pull --rebase --autostash
          git push

      # ── 여기서부터 사이트 재배포 (데이터 갱신과 같은 워크플로우에서 처리) ──
      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'     # 저장소 전체(index.html + signals.json)

      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
