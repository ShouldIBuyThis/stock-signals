name: 관심종목 자동 갱신
run-name: ${{ github.event_name == 'schedule' && github.event.schedule == '10 16 * * 1-5' && 'KR 정기 16:10' || github.event_name == 'schedule' && github.event.schedule == '30 16 * * 1-5' && 'KR 재시도 16:30' || github.event_name == 'schedule' && github.event.schedule == '50 16 * * 1-5' && 'KR 재시도 16:50' || '관심종목 자동 갱신' }}

on:
  # 화면·계산기·워크플로 자체를 수정하면 다음 정기 실행을 기다리지 않고 배포한다.
  # 자동 갱신이 커밋하는 signals.json/history는 대상이 아니므로 재귀 실행되지 않는다.
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'main.py'
      - 'pattern_flags.py'          # main.py가 쓰는 계산 정의(고점판독기 블록 등) — 바뀌면 다시 계산해야 화면과 맞는다
      - '.github/workflows/update.yml'
  schedule:
    # 미국장 1차: 뉴욕 현지 16:40 — 장 마감 40분 후
    - cron: '40 16 * * 1-5'
      timezone: 'America/New_York'
    # 미국장 백업: 뉴욕 현지 17:20 — 1차 schedule 누락/지연 대비
    - cron: '20 17 * * 1-5'
      timezone: 'America/New_York'
    # 미국장 3차: 뉴욕 현지 21:30 — 2026-10-01~07 야후 일봉이 마감 4~5시간 뒤에도 최신 행을
    # 비워 둬 1·2차가 연달아 실패했다. main.py가 quote 확정값으로 복원하지만 그것도 안 되면 여기서 다시 잡는다.
    - cron: '30 21 * * 1-5'
      timezone: 'America/New_York'

    # 한국장 정기 갱신: 16:10 KST → 실패하면 16:30 → 또 실패하면 16:50 (2026-11-11 사용자 지시).
    # 야후 국장 시세가 약 20분 늦어 마감 직후엔 종가가 단일가 전 값일 수 있다 → main.py
    # kr_official_close_gate()가 15:30 이후 체결·공식 종가 일치를 확인하지 못하면 실행을 실패시켜
    # 원장에 쓰지 않는다. 세 시각은 서로 독립된 schedule이라 하나가 GitHub에서 통째로 누락돼도
    # (2026-11-11 16:00 정기 실행이 아예 생성되지 않았다) 다음 시각이 갱신한다.
    # 앞선 시도가 이미 성공했으면 precheck가 뒤 시도를 건너뛴다.
    - cron: '10 16 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '30 16 * * 1-5'
      timezone: 'Asia/Seoul'
    - cron: '50 16 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      scope:
        description: '수동 갱신 범위'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - kr
          - all
      force_resnap:
        description: '현재 scope의 당일 스냅샷/hist를 강제로 다시 확정'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 국장 16:10/16:30/16:50 중 앞선 시도가 이미 성공했으면 뒤 시도는 건너뛴다.
  # 16:10은 Claude 예약 작업의 workflow_dispatch(scope=kr)가 정시 1차, 같은 시각 schedule은 GitHub 쪽 백업이다.
  # 성공 판정: 오늘(KST) 국장 schedule 실행 중 success가 있거나, 오늘자 history/kr 스냅샷이 main에 있다
  # (공식 종가 확인 장치를 통과해야만 스냅샷이 써지므로 수동 kr 실행 성공도 여기서 잡힌다).
  precheck:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.kr.outputs.skip }}
    steps:
      - name: 국장 재시도 필요 여부
        id: kr
        uses: actions/github-script@v7
        with:
          script: |
            const ev = context.eventName, sch = context.payload.schedule || '';
            const inp = context.payload.inputs || {};
            const KR = ['10 16 * * 1-5', '30 16 * * 1-5', '50 16 * * 1-5'];
            // 대상: 국장 schedule 3개 + 예약 작업이 16:10에 보내는 수동 실행(scope=kr, force_resnap=false).
            // force_resnap=true 수동 실행과 us/all 실행은 절대 건너뛰지 않는다.
            const krSched = ev === 'schedule' && KR.includes(sch);
            const krDispatch = ev === 'workflow_dispatch' && inp.scope === 'kr' && String(inp.force_resnap) !== 'true';
            if (!krSched && !krDispatch) { core.setOutput('skip', 'false'); return; }
            const day = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
            // 2026-11-13: 전날 KR 예약 실행이 9시간 늦게(한국 00:55~01:18) 돌아 '오늘 성공'으로 잘못 세어 오늘 갱신을 건너뛰었다.
            // 오늘 장 마감(15:30) 뒤에 만들어진 실행만 오늘 종가를 반영했을 수 있으므로 그 뒤 실행만 센다.
            const start = new Date(`${day}T15:30:00+09:00`).toISOString();
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'update.yml', branch: 'main',
              event: 'schedule', created: `>=${start}`, per_page: 100
            });
            const ok = runs.find(r => r.id !== context.runId && /^KR /.test(r.display_title || '') && r.conclusion === 'success');
            let snap = false;
            try {
              await github.rest.repos.getContent({ ...context.repo, path: `history/kr/${day}.json`, ref: 'main' });
              snap = true;
            } catch (e) { if (e.status !== 404) throw e; }
            const skip = !!ok || snap;
            core.setOutput('skip', skip ? 'true' : 'false');
            core.info(skip ? `건너뜀: ${ok ? `앞선 KR 실행 ${ok.id} 성공` : ''}${snap ? ` · history/kr/${day}.json 있음` : ''}`
                           : `앞선 KR 시도 성공 없음 → ${sch} 재시도 진행`);

  update:
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      pages_artifact: ${{ steps.artifact_name.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: 최신 원장으로 시작
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C ci-update origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install "yfinance==1.5.2" pandas numpy exchange_calendars

      - name: 종가 날짜·혼합 원장 회귀 검사
        run: |
          python tools/test_us_freshness.py
          python tools/test_mixed_snapshot.py

      - name: 갱신 범위 결정
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$MANUAL_SCOPE" >> "$GITHUB_OUTPUT"
            echo "수동 실행 → scope=$MANUAL_SCOPE"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            # 코드 변경 배포는 장중인 시장을 건드리지 않는다(CLAUDE.md §5 — 국장 개장 중 scope=kr 금지).
            # 국장 08:30~17:00 KST(정기 갱신 16:10 · 재시도 16:30·16:50)면 us만, 미장 09:00~16:40 ET면 kr만, 그 밖에는 all.
            kst_dow=$(TZ=Asia/Seoul date +%u); kst_hm=$((10#$(TZ=Asia/Seoul date +%H%M)))
            ny_dow=$(TZ=America/New_York date +%u); ny_hm=$((10#$(TZ=America/New_York date +%H%M)))
            scope=all
            if [ "$kst_dow" -le 5 ] && [ "$kst_hm" -ge 830 ] && [ "$kst_hm" -lt 1700 ]; then
              scope=us
            elif [ "$ny_dow" -le 5 ] && [ "$ny_hm" -ge 900 ] && [ "$ny_hm" -lt 1640 ]; then
              scope=kr
            fi
            echo "value=$scope" >> "$GITHUB_OUTPUT"
            echo "코드 변경 실행 → scope=$scope (KST $kst_hm · NY $ny_hm)"
            exit 0
          fi

          # 중요: 실제 runner 시작 시각으로 시장을 판단하지 않는다.
          # GitHub schedule은 지연될 수 있으므로, 어떤 schedule이 트리거했는지를 기준으로 판정한다.
          case "$SCHEDULE_EXPR" in
            "40 16 * * 1-5"|"20 17 * * 1-5"|"30 21 * * 1-5")
              echo "value=us" >> "$GITHUB_OUTPUT"
              echo "자동 실행 → US ($SCHEDULE_EXPR)"
              ;;
            "10 16 * * 1-5"|"30 16 * * 1-5"|"50 16 * * 1-5")
              echo "value=kr" >> "$GITHUB_OUTPUT"
              echo "자동 실행 → KR ($SCHEDULE_EXPR)"
              ;;
            *)
              echo "::error::알 수 없는 schedule: '$SCHEDULE_EXPR'"
              exit 1
              ;;
          esac

      - name: 재촬영 요청 확인
        id: resnap
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_FORCE_RESNAP: ${{ inputs.force_resnap }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FORCE_RESNAP" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "⚠ FORCE_RESNAP=true — scope=${{ steps.scope.outputs.value }}"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 갱신 전 frozen 원장 보관
        shell: bash
        run: cp signals.json "$RUNNER_TEMP/signals.before.json"

      - name: 지표 계산 1차
        id: calc
        continue-on-error: true
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: python main.py

      - name: 지표 계산 실패 시 10분 뒤 1회 재시도
        if: steps.calc.outcome == 'failure' && steps.scope.outputs.value != 'kr'
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: |
          echo "1차 갱신 실패 — 10분 뒤 같은 범위로 1회 재시도합니다."
          sleep 600
          python main.py

      - name: KR 계산 실패를 작업 실패로 확정
        if: steps.calc.outcome == 'failure' && steps.scope.outputs.value == 'kr'
        run: exit 1

      - name: 산출물 기본 검증
        shell: bash
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: |
          set -euo pipefail
          args=(signals.json --previous "$RUNNER_TEMP/signals.before.json" --scope "$RUN_SCOPE")
          if [ "$FORCE_RESNAP" = "true" ]; then args+=(--force-resnap); fi
          python validate_signals.py "${args[@]}"

          # 자동/일반 실행은 기존 snapshot 파일 수정을 절대 허용하지 않는다.
          if [ "$FORCE_RESNAP" != "true" ] && [ -n "$(git diff --name-only --diff-filter=M -- history/)" ]; then
            echo "::error::FORCE_RESNAP 없이 기존 history snapshot이 수정됐습니다."
            git diff --name-status -- history/
            exit 1
          fi

      - name: 실패 학습 리포트 생성
        # 중립 판정 직후 급등한 종목의 관문 부검 (tools/miss-report.js).
        # 리포트 실패가 데이터 갱신을 막으면 안 되므로 continue-on-error.
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          node tools/miss-report.js > reports/실패학습.md

      - name: signals.json / history 커밋
        shell: bash
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          commit_generated() {
            git add signals.json history/ reports/ holdings/
            git commit -m "auto: signals 갱신 ($RUN_SCOPE)" || echo "변경 없음"
          }

          validate_retry() {
            args=(signals.json --previous "$RUNNER_TEMP/signals.before.retry.json" --scope "$RUN_SCOPE")
            if [ "$FORCE_RESNAP" = "true" ]; then args+=(--force-resnap); fi
            python validate_signals.py "${args[@]}"
            if [ "$FORCE_RESNAP" != "true" ] && [ -n "$(git diff --name-only --diff-filter=M -- history/)" ]; then
              echo "::error::재시도 중 기존 history snapshot 수정 감지"
              exit 1
            fi
          }

          commit_generated
          if git push origin HEAD:main; then
            exit 0
          fi

          # 원격 signals.json이 새로 갱신된 경우 자동 merge로 원장을 선택하지 않는다.
          # 최신 원격 원장에서 같은 scope를 다시 계산해 히스토리 유실을 막는다.
          for attempt in 2 3; do
            echo "푸시 충돌 — 최신 원장에서 ${attempt}차 재계산"
            git fetch origin main
            git switch -C ci-update origin/main
            cp signals.json "$RUNNER_TEMP/signals.before.retry.json"
            RUN_SCOPE="$RUN_SCOPE" FORCE_RESNAP="$FORCE_RESNAP" python main.py
            validate_retry
            node tools/miss-report.js > reports/실패학습.md || echo "리포트 생성 실패 — 갱신은 계속"
            commit_generated
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "::error::최신 원장 재계산 후에도 푸시가 3회 충돌했습니다."
          exit 1

      - name: 표시 전용 자료 점검(고점판독기 블록 · 검증 조합 파일) — 원장과 무관 · 경고만
        continue-on-error: true
        run: python tools/check-display-data.py

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 실행별 Pages 아티팩트 이름
        id: artifact_name
        run: echo "value=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact_name.outputs.value }}
          path: '.'

  # 데이터 생성/업로드와 Pages 배포를 분리한다.
  # deploy-pages만 실패했을 때 "실패한 작업 재실행"을 눌러도 위 update 작업과
  # github-pages 아티팩트를 다시 만들지 않으므로, 같은 실행에 동명 아티팩트가
  # 2개 생겨 배포가 막히는 문제를 피한다.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.update.outputs.pages_artifact }}
