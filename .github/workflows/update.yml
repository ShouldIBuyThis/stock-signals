name: 관심종목 자동 갱신

on:
  schedule:
    # 미국장 1차: 뉴욕 현지 16:40 — 장 마감 40분 후
    - cron: '40 16 * * 1-5'
      timezone: 'America/New_York'
    # 미국장 백업: 뉴욕 현지 17:20 — 1차 schedule 누락/지연 대비
    - cron: '20 17 * * 1-5'
      timezone: 'America/New_York'

    # 한국장 1차: 15:45 KST
    - cron: '45 15 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      scope:
        description: '수동 갱신 범위'
        required: true
        default: 'us'
        type: choice
        options:
          - us
          - kr
          - all
      force_resnap:
        description: '현재 scope의 당일 스냅샷/hist를 강제로 다시 확정'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: pip install "yfinance==1.5.2" pandas numpy exchange_calendars

      - name: 갱신 범위 결정
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          MANUAL_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "value=$MANUAL_SCOPE" >> "$GITHUB_OUTPUT"
            echo "수동 실행 → scope=$MANUAL_SCOPE"
            exit 0
          fi

          # 중요: 실제 runner 시작 시각으로 시장을 판단하지 않는다.
          # GitHub schedule은 지연될 수 있으므로, 어떤 schedule이 트리거했는지를 기준으로 판정한다.
          case "$SCHEDULE_EXPR" in
            "40 16 * * 1-5"|"20 17 * * 1-5")
              echo "value=us" >> "$GITHUB_OUTPUT"
              echo "자동 실행 → US ($SCHEDULE_EXPR)"
              ;;
            "45 15 * * 1-5")
              echo "value=kr" >> "$GITHUB_OUTPUT"
              echo "자동 실행 → KR ($SCHEDULE_EXPR)"
              ;;
            *)
              echo "::error::알 수 없는 schedule: '$SCHEDULE_EXPR'"
              exit 1
              ;;
          esac

      - name: 재촬영 요청 확인
        id: resnap
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_FORCE_RESNAP: ${{ inputs.force_resnap }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FORCE_RESNAP" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "⚠ FORCE_RESNAP=true — scope=${{ steps.scope.outputs.value }}"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 지표 계산 1차
        id: calc
        continue-on-error: true
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: python main.py

      - name: 지표 계산 실패 시 10분 뒤 1회 재시도
        if: steps.calc.outcome == 'failure'
        env:
          RUN_SCOPE: ${{ steps.scope.outputs.value }}
          FORCE_RESNAP: ${{ steps.resnap.outputs.value }}
        run: |
          echo "1차 갱신 실패 — 10분 뒤 같은 범위로 1회 재시도합니다."
          sleep 600
          python main.py

      - name: 산출물 기본 검증
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open("signals.json", encoding="utf-8") as f:
              p=json.load(f)
          stocks=p.get("stocks") or []
          assert stocks, "signals.json stocks가 비었습니다."
          assert isinstance(p.get("hist_fields"), list) and "atr_pct" in p["hist_fields"], "hist_fields/atr_pct 누락"
          print(f"signals.json 검증 PASS — {len(stocks)}종목")
          PY

      - name: signals.json / history 커밋
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signals.json history/
          git commit -m "auto: signals 갱신 (${{ steps.scope.outputs.value }})" || echo "변경 없음"
          git pull --rebase --autostash
          git push

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 사이트 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
