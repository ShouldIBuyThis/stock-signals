name: 가설 검증 실험 (실험 · 로그만)

# 사용자 가설(2026-08-20) 검증 전용 수동 워크플로우.
#   A) 실적 발표 1~2주 전 '연속 음봉' → 어닝 서프라이즈가 나온다
#   B) 그 반대 — 발표 전에 올려놨으면 발표는 실망
#   C) 종가 캔들 모양(망치형·장악형·샛별형 등 16종)으로 잡는 신호의 실제 승률
#   D) 와인스타인 4단계 + '장기선 눌림 매수'(사용자 아이디어) 승률 — 추세 vs 반등
#   E) 장 초반 30~60분의 '기운'이 그날 종가를 예고하나 (장중 갱신 기능 도입 전 전제 검증)
#   F) 피보나치 되돌림·하모닉(XABCD) — 만들 가치가 있나 (리페인트 금지로 측정)
#
# ⚠ 아무 파일도 커밋하지 않는다. 원장(signals.json·history/)도, 백테스트 산출물도
#    건드리지 않는다. 결과는 이 잡의 로그에만 남는다.
# ⚠ 로컬은 야후가 프록시에 막혀 있어 여기서만 돈다.

on:
  workflow_dispatch:
    inputs:
      years:
        description: '주가 수집 기간(년) — 실적 분기 수를 좌우한다'
        required: false
        default: '3'

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -q yfinance pandas numpy exchange_calendars

      - name: 실적 전 흐름 검증
        continue-on-error: true
        run: python tools/earnings-lab.py --years "${{ inputs.years || '3' }}"

      - name: 캔들 패턴 승률 검증
        continue-on-error: true
        run: python tools/candle-lab.py --years "${{ inputs.years || '3' }}"

      - name: 와인스타인 4단계 · 장기선 눌림 검증
        continue-on-error: true
        run: python tools/stage-lab.py --years "${{ inputs.years || '3' }}"

      - name: 장 초반 기운 검증
        continue-on-error: true
        run: python tools/openrange-lab.py

      - name: 피보나치 되돌림 · 하모닉 검증
        continue-on-error: true
        run: python tools/fib-lab.py --years "${{ inputs.years || '3' }}"

      - name: 아무것도 안 바뀌었는지 확인
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::실험 워크플로우가 파일을 바꿨다 — 읽기 전용이어야 한다"
            git status --porcelain
            exit 1
          fi
