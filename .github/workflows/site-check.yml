name: 사이트 점검 (문법 · 블록 대조 · JSON 구조 · 모바일)

# 화면·계산 정의·검증 조합 파일이 바뀌면 자동으로 점검한다. 데이터·원장·배포는 건드리지 않는다(읽기만).
on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'index.html'
      - 'pattern_flags.py'
      - 'main.py'
      - 'backtest/peak-highlights.json'
      - 'tools/peak-combo-lab.py'
      - 'tools/test_combo_blocks.py'
      - 'tools/test-site-mobile.js'
      - 'tools/check-*.py'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성
        run: |
          pip install -q pandas numpy
          npm install --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: 브라우저 스크립트 문법(node --check)
        run: python tools/check-inline-js.py
      - name: 화면 블록 = 연구 블록 대조
        run: python tools/test_combo_blocks.py
      - name: 기존 패턴 정의 회귀
        run: python tools/test_pattern_flags.py
      - name: 검증 조합 파일 구조(엄격) · signals.json 표시 자료(경고)
        run: |
          python tools/check-display-data.py --strict --highlights-only
          python tools/check-display-data.py
      - name: 모바일·PC 표시
        run: |
          python -m http.server 8765 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:8765/index.html >/dev/null && break; sleep 1; done
          node tools/test-site-mobile.js
