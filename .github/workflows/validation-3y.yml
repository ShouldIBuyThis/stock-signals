name: 도움말 승률표 3년 백테스트

# 도움말 '현재 산식 검증' 표(💡·🔵·🟢·기준선)가 읽는 backtest/validation-3y.json을 만든다(백테스트 · 원장 아님).
# 판정은 index.html strategyValidation() 그대로(tools/validation-3y.js).
# 2026-11-06 사용자 지시: "일주일에 한 번 월요일마다, 매일 하지 말고" → 월요일 07:41 KST(일 22:41 UTC) + 수동.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 22 * * 0'

permissions:
  contents: write

concurrency:
  group: validation-3y
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        run: pip install -q yfinance pandas numpy exchange_calendars
      - name: 3년 원본 수집 (야후)
        run: python tools/backfill_backtest.py --years 3 --days 690 --out backtest/raw.json
      - name: 승률표 계산
        run: node tools/validation-3y.js backtest/raw.json backtest/validation-3y.json
      - name: 원본 삭제 · 원장 불변 확인
        run: |
          rm -f backtest/raw.json
          if [ -n "$(git status --porcelain -- signals.json history/)" ]; then
            echo "::error::원장(signals.json·history/)이 변경됐다 — 중단한다"; exit 1
          fi
      - name: 커밋
        run: |
          git config user.name  "Claude"
          git config user.email "noreply@anthropic.com"
          git add backtest/validation-3y.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "도움말 승률표 3년 백테스트 갱신"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            if git push origin "HEAD:${BR}"; then exit 0; fi
            echo "push 충돌 — 리베이스 후 재시도 ($i/3)"
            git pull --rebase origin "${BR}"
            sleep $((i*5))
          done
          echo "::error::리베이스 재시도 3회 실패"; exit 1
