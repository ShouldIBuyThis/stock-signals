name: Validation 100
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build initial raw seed only once
        run: |
          if [ ! -f validation100_input.json ]; then
            pip install yfinance pandas numpy
            python validation100_prepare.py
          else
            echo "validation100_input.json exists — skip heavy historical fetch"
          fi
      - name: Re-score current formula and append latest hist
        run: node validation100.js
      - name: Commit validation ledger and summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation100_input.json validation100_summary.json validation100_samples.csv
          git diff --cached --quiet || git commit -m "Update validation100"
          git push
