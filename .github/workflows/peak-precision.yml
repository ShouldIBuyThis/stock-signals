name: 고점판독기 4차·5차 연구 (고정밀 교집합 · 수동)

# 수동 실행 전용. 사전 등록 그대로 돌린다 — 4차 docs/2026-11-12-peak-precision.md(5f95c3a) · 5차 docs/2026-11-12-peak-combo.md(59d32c7 · f58e5fc).
# 결과 JSON만 main에 커밋한다. ⚠ 원장(signals.json·history/)·화면 판정은 건드리지 않는다. 백테스트(생존 편향 있음).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peak-precision
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성 설치
        run: pip install -q yfinance pandas numpy requests lxml
      - name: 4차 — 고정밀 소수 신호 13개(판정 = 미사용 Z)
        run: python tools/peak-precision-lab.py --emit "$RUNNER_TEMP/peak-precision.json" --cache "$RUNNER_TEMP/pp.pkl"
      - name: 5차 2회 — 방향 기준 D(§10·§11) · 🔴 고점 붕괴 R·Q(§12) · 🟡 일부익절 F·T·M(§13) · 봉인 검증 ZB
        # 1회(ATR 기준 🟡A·🔴B) 결과 backtest/peak-combo.json · 4차 결과 peak-precision.json은 보존(덮어쓰지 않음)
        run: python tools/peak-combo-lab.py --cache "$RUNNER_TEMP/pp.pkl" --emit "$RUNNER_TEMP/peak-combo2.json" --only D,R,Q,F,T,M
      - name: 입력 시세 스냅샷 보관(진단·재현용 · 30일)
        uses: actions/upload-artifact@v4
        with:
          name: peak-price-cache
          path: ${{ runner.temp }}/pp.pkl
          retention-days: 30
      - name: 결과만 main에 커밋
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git switch -C pp-out origin/main
            cp "$RUNNER_TEMP/peak-combo2.json" backtest/peak-combo2.json
            git add backtest/peak-combo2.json
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -m "auto: 5차 2회 연구 결과(backtest/peak-combo2.json · D·R·Q·F·T·M)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 5))
          done
          echo "::error::푸시 3회 실패"; exit 1
