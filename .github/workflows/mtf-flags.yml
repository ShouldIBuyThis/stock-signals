name: 주봉·월봉 연구 후보 플래그 (매일)

# 2026-11-18 사용자 승인: 일부익절 #1·#4 · 고점판독기 #2(docs/2026-11-13-mtf-cross.md)를 연구 후보로 표시.
# 관심종목마다 '마지막 완성 주봉·월봉' 조건만 계산해 backtest/mtf-flags.json으로 커밋한다(진행 중인 주·달 금지).
# examples=true면 3년 백필로 연구를 다시 돌려 적중·실패 사례(backtest/mtf-examples.json)도 만든다.
# 산식·원장·signals.json은 건드리지 않는다. 사이트는 신호일과 완성 봉 날짜가 맞을 때만 이 값을 쓴다.
on:
  schedule:
    - cron: '50 21 * * 1-5'   # 미국 장 마감 뒤
    - cron: '40 7 * * 1-5'    # 한국 장 마감 뒤
  workflow_dispatch:
    inputs:
      examples:
        description: '적중·실패 사례도 다시 만들기(3년 백필 · 약 10분)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mtf-flags
  cancel-in-progress: false

jobs:
  flags:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 의존성 설치
        run: pip install -q yfinance pandas numpy exchange_calendars
      - name: 플래그 계산
        run: python tools/mtf-flags.py signals.json "$RUNNER_TEMP/mtf-flags.json"
      - name: 사례 다시 만들기(선택)
        if: ${{ inputs.examples }}
        run: |
          python tools/backfill_backtest.py --years 3 --days 690 --out backtest/raw.json
          node tools/mtf-export.js backtest/raw.json /tmp/mtf.json
          python tools/mtf-cross-lab.py /tmp/mtf.json --examples "$RUNNER_TEMP/mtf-examples.json" | tail -8
          rm -f backtest/raw.json backtest/pattern-entries.json
      - name: 결과만 main에 커밋
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main
            git switch -C mtf-out origin/main
            cp "$RUNNER_TEMP/mtf-flags.json" backtest/mtf-flags.json
            [ -f "$RUNNER_TEMP/mtf-examples.json" ] && cp "$RUNNER_TEMP/mtf-examples.json" backtest/mtf-examples.json
            git add backtest/mtf-flags.json backtest/mtf-examples.json 2>/dev/null || git add backtest/mtf-flags.json
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -m "auto: 주봉·월봉 연구 후보 플래그(backtest/mtf-flags.json)"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 7))
          done
          exit 1
